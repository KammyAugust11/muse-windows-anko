name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # only used by the release step on tags
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/anko.exe, Install.cmd, Uninstall.cmd, README.md, LICENSE dist/
          $b64 = (Get-Content assets/icon.ico.base64 -Raw) -replace '\s', ''
          [IO.File]::WriteAllBytes("$PWD/dist/icon.ico", [Convert]::FromBase64String($b64))
          Compress-Archive -Path dist/* -DestinationPath muse-windows-anko.zip

      - uses: actions/upload-artifact@v4
        with:
          name: muse-windows-anko
          path: dist/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" muse-windows-anko.zip --title "${{ github.ref_name }}" --generate-notes
